name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend tests
    # 本项目是 macOS 优先的本地应用：终端能力调用 Terminal.app（`open -a Terminal`），
    # 应用数据默认位于 ~/Library/Application Support。后端测试因此跑在 macOS runner 上，
    # 与开发环境保持一致，避免平台差异造成假失败。
    runs-on: macos-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Install pinned Rust toolchain
        run: |
          toolchain=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)
          test -n "$toolchain"
          rustup toolchain install "$toolchain" --profile minimal
          rustc --version
          cargo --version

      - name: Install locked dependencies and build native extension
        run: |
          # vec extra：sqlite-vec 原生向量 KNN 测试所需。
          # dev extra 已包含 httpx2；依赖版本来自 uv.lock。
          uv sync --locked --python 3.12 --extra dev --extra vec

      - name: Verify native extension and ABI
        run: .venv/bin/python ../../scripts/verify_native.py

      - name: Run locked Rust workspace tests
        run: PYO3_PYTHON="$PWD/.venv/bin/python" cargo test --workspace --locked

      - name: Run backend tests
        # 直接调用 .venv/bin/python（不用 `uv run`），避免 uv 在运行阶段重新同步环境、
        # 丢掉上面手动安装的 extra。
        # 固定 TZ：提案预算（quiet hours / 每日额度 / 冷却期）按本地时间计算，
        # 测试以 Asia/Shanghai 为基准；GitHub runner 默认 UTC，不固定时区会假失败。
        # 也不加 `-W error`：starlette / anyio 在导入期就会发出第三方弃用警告，
        # 升级为错误会导致测试模块导入失败（与本仓库代码无关）。
        env:
          TZ: Asia/Shanghai
        run: |
          set +e
          .venv/bin/python -m unittest discover -s tests > "$RUNNER_TEMP/backend-tests.log" 2>&1
          status=$?
          tail -n 40 "$RUNNER_TEMP/backend-tests.log"
          if [ "$status" -ne 0 ]; then
            grep -E "^(Ran |OK|FAILED)" "$RUNNER_TEMP/backend-tests.log" | tail -n 2 | while IFS= read -r line; do
              echo "::error title=backend summary::$line"
            done
            awk '/^(FAIL|ERROR): /{hdr=$0; last=$0; next} hdr!="" && NF{last=$0} /^$/{if(hdr!=""){print hdr " || " last; hdr=""}} END{if(hdr!="")print hdr " || " last}' "$RUNNER_TEMP/backend-tests.log" | head -n 20 | while IFS= read -r line; do
              echo "::error title=backend case::$line"
            done
          fi
          exit "$status"

  web:
    name: Web build & unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check & build
        run: npm run build

      - name: Unit tests
        run: npm run test:unit
