name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend tests
    # 本项目是 macOS 优先的本地应用：终端能力调用 Terminal.app（`open -a Terminal`），
    # 应用数据默认位于 ~/Library/Application Support。后端测试因此跑在 macOS runner 上，
    # 与开发环境保持一致，避免平台差异造成假失败。
    runs-on: macos-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          uv venv .venv
          # vec extra：sqlite-vec 原生向量 KNN 测试所需；
          # httpx2：starlette 1.6 起 TestClient 的首选依赖（缺失时会回退并发出弃用警告）。
          uv pip install --python .venv/bin/python -e '.[dev,vec]' httpx2

      - name: Run backend tests
        # 不加 `-W error`：starlette / anyio 在导入期就会发出第三方弃用警告，
        # 升级为错误会导致测试模块导入失败（与本仓库代码无关）。
        run: |
          set +e
          uv run python -m unittest discover -s tests > "$RUNNER_TEMP/backend-tests.log" 2>&1
          status=$?
          tail -n 40 "$RUNNER_TEMP/backend-tests.log"
          if [ $status -ne 0 ]; then
            # 失败时把用例名与断言要点转成 GitHub 注解，便于在提交页直接定位问题。
            python3 - "$RUNNER_TEMP/backend-tests.log" <<'PY'
import re
import sys
import pathlib

log = pathlib.Path(sys.argv[1]).read_text(errors="replace")
blocks = [b.strip() for b in re.split(r"^={70}$", log, flags=re.M)]
issues = [b for b in blocks if b.startswith(("FAIL:", "ERROR:"))]
summary = re.search(r"^(Ran .*|FAILED .*|OK .*)$", log, flags=re.M)
print(f"::error title=后端测试失败::失败/错误用例 {len(issues)} 个"
      + (f"；{summary.group(1)}" if summary else ""))

def esc(text: str) -> str:
    return text.replace("%", "%25").replace("\r", "").replace("\n", " ")

for block in issues[:12]:
    lines = [l.strip() for l in block.splitlines() if l.strip()]
    head = lines[0]
    detail = " | ".join(lines[1:8])
    print(f"::error title=backend test::{esc((head + ' — ' + detail))[:900]}")
PY
          fi
          exit $status

  web:
    name: Web build & unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check & build
        run: npm run build

      - name: Unit tests
        run: npm run test:unit

  # 浏览器 E2E 需要安装 Playwright 浏览器并启动前后端，首次接入建议单独手动触发，
  # 稳定后再打开下面的 job（去掉注释并确认 `npm run test:e2e` 在 CI 环境可跑通）。
